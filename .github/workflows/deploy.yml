name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check reservation e-mails are configured
        run: |
          if grep -q 'vase-domena.cz' public/rezervace.php; then
            echo "::warning file=public/rezervace.php::Placeholder e-mail addresses are still set, reservations will not arrive."
          fi

      # Uploads only changed files and never deletes anything it did not upload itself.
      - name: Upload over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./public/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'www/' }}
