name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Errors in public/obsah/*.txt stop the deploy, so the live site keeps the last good version.
      - name: Check content files
        run: node scripts/kontrola-obsahu.js

      # With placeholder addresses the form would report success while bookings go nowhere.
      - name: Check reservation e-mails are configured
        run: |
          if grep -q 'vase-domena.cz' public/rezervace.php; then
            echo "::error file=public/rezervace.php::Placeholder e-mail addresses are still set, reservations would be lost."
            exit 1
          fi

      # noindex keeps the site, with its sample prices, out of search results until the content is final.
      - name: Prepare site
        run: |
          mkdir _site
          cp -R public/. _site/
          sed -i 's|<head>|<head>\n<meta name="robots" content="noindex">|' _site/index.html

      # Uploads only changed files and never deletes anything it did not upload itself.
      - name: Upload over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./_site/
          # The FTP account's home is the www folder. Set FTP_SERVER_DIR to 'www/' if you use the main account instead.
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
