name: Publish to GitHub Pages

# Temporary preview until the site moves to WEDOS (deploy.yml).
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check content files
        run: node scripts/kontrola-obsahu.js

      # Pages cannot run PHP and would serve its source, so the form script stays out.
      # noindex keeps the preview, with its sample prices, out of search results.
      - name: Prepare site
        run: |
          mkdir _site
          cp -R public/. _site/
          rm _site/rezervace.php
          sed -i 's|<head>|<head>\n<meta name="robots" content="noindex">|' _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
